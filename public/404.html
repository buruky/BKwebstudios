<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · BK Web Studios</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4efe8">
<!-- Served by Vercel (and GitHub Pages) for any unknown URL, at any depth, so every link here is root-absolute. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600&display=swap">
<style>
  /* Same palette as src/global.css. */
  :root {
    --ember: #d57d3b;
    --dune: #2a2f33;
    --bone: #f4efe8;
    --accent: #2e6170;
    --linen: #e8e0d4;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bone);
    color: var(--dune);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .bar, main, .credits {
    padding-left: max(clamp(16px, 3.4vw, 48px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 3.4vw, 48px), env(safe-area-inset-right, 0px));
  }
  .bar {
    height: 64px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgb(42 47 51 / 0.12);
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; }
  .mark {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--dune); color: var(--bone);
    font-family: "Clash Display", system-ui, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.03em;
  }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 48px; padding-bottom: 48px; }
  .tag { margin: 0 0 12px; color: var(--ember); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  .code {
    margin: 0;
    font-family: "Clash Display", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(120px, 30vw, 360px);
    line-height: 0.82;
    letter-spacing: -0.05em;
    animation: rise 700ms var(--ease-out) both;
  }
  .code span { color: var(--accent); }
  h1 {
    margin: 28px 0 12px;
    max-width: 24ch;
    font-family: "Clash Display", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(28px, 4.4vw, 48px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    animation: rise 700ms 80ms var(--ease-out) both;
  }
  .note { margin: 0; max-width: 46ch; font-size: 15px; line-height: 1.6; color: rgb(42 47 51 / 0.75); animation: rise 700ms 140ms var(--ease-out) both; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; animation: rise 700ms 200ms var(--ease-out) both; }
  .pill {
    display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px;
    font-family: "Schibsted Grotesk", system-ui, sans-serif; font-weight: 600; font-size: 16px; text-decoration: none;
    transition: transform 160ms var(--ease-out), background-color 160ms;
  }
  .pill:active { transform: scale(0.97); }
  .home { background: var(--dune); color: var(--bone); }
  .home:hover { background: #1d1a18; }
  .book { border: 1px solid rgb(42 47 51 / 0.3); }
  .book:hover { background: var(--linen); }

  /* The Flash hero's film-credits row, retold for a missing page. */
  .credits {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin: 0;
    padding-top: 20px;
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgb(42 47 51 / 0.12);
    font-size: 13px;
  }
  .credits dt { color: rgb(42 47 51 / 0.6); letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }
  .credits dd { margin: 4px 0 0; font-weight: 500; overflow-wrap: anywhere; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><span class="mark" aria-hidden="true">bk</span>BK Web Studios</a>
</header>

<main>
  <p class="tag">Error 404</p>
  <p class="code" aria-hidden="true">4<span>0</span>4</p>
  <h1>This page took a wrong turn.</h1>
  <p class="note">The link may be old, or the address has a typo. Everything else is right where you left it.</p>
  <div class="actions">
    <a class="pill home" href="/">Back to the homepage</a>
    <a class="pill book" href="https://cal.com/buruk-yimesgen-xvoxel/bk-webstudios">Book a free call</a>
  </div>
</main>

<dl class="credits">
  <div><dt>Page</dt><dd id="path">Not found</dd></div>
  <div><dt>Built by</dt><dd>Buruk Yimesgen</dd></div>
  <div><dt>Based in</dt><dd>Seattle, WA</dd></div>
</dl>
<script>
  // Show the address that missed, in place of "Not found".
  try { document.getElementById("path").textContent = decodeURI(location.pathname); } catch {}
</script>
</body>
</html>
